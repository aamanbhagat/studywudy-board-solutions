name: Deploy production

on:
  workflow_dispatch:
  push:
    tags:
      - production-*

permissions:
  contents: read

concurrency:
  group: studywudy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: production
    steps:
      - name: Check out tagged release
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify exact release inputs
        run: pnpm check:release

      - name: Deploy the verified commit
        run: >-
          pnpm exec wrangler deploy
          --config wrangler.production.jsonc
          --keep-vars
          --strict
          --tag "${GITHUB_REF_NAME:-manual-${GITHUB_SHA::12}}"
          --message "git:${GITHUB_SHA}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
